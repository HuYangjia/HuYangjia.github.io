<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
  <title id="title">Logical blocks and physical tokens connected by a MAP layer</title>
  <desc id="desc">The upper layer retains block-level prefix caching. A MAP layer connects this logical view to token-level physical KV data exchanged between GPU and CPU memory.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.8"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="268" rx="16" fill="#f8fafc" stroke="#dbe3ed"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="24" y="32" width="270" height="180" rx="10" fill="#e8efff" stroke="#88a7e1"/>
    <text x="159" y="69" font-size="23" font-weight="700" fill="#254780">Logical: blocks</text>
    <text x="159" y="98" font-size="18" fill="#405b84">Prefix cache semantics</text>
    <rect x="49" y="126" width="98" height="49" rx="6" fill="#fff" stroke="#88a7e1"/>
    <rect x="171" y="126" width="98" height="49" rx="6" fill="#fff" stroke="#88a7e1"/>
    <text x="98" y="157" font-size="18" fill="#254780">Block A</text>
    <text x="220" y="157" font-size="18" fill="#254780">Block B</text>
    <path d="M307 124H343" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="355" y="73" width="220" height="104" rx="10" fill="#fff" stroke="#b5c0cf"/>
    <text x="465" y="115" font-size="27" font-weight="700" fill="#27384e">MAP</text>
    <text x="465" y="146" font-size="17" fill="#526276">Logical ↔ physical</text>
    <path d="M587 124H624" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="636" y="32" width="300" height="180" rx="10" fill="#e5f4ee" stroke="#83b6a1"/>
    <text x="786" y="69" font-size="23" font-weight="700" fill="#21664f">Physical: tokens</text>
    <text x="786" y="98" font-size="18" fill="#3f725f">Token-level exchange</text>
    <rect x="652" y="121" width="112" height="66" rx="6" fill="#fff" stroke="#83b6a1"/>
    <rect x="808" y="121" width="112" height="66" rx="6" fill="#fff" stroke="#83b6a1"/>
    <text x="708" y="148" font-size="18" font-weight="700" fill="#21664f">GPU</text>
    <text x="708" y="172" font-size="16" fill="#3f725f">KV tokens</text>
    <text x="864" y="148" font-size="18" font-weight="700" fill="#21664f">CPU</text>
    <text x="864" y="172" font-size="16" fill="#3f725f">KV tokens</text>
    <path d="M773 144H799" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <path d="M799 164H773" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="480" y="245" font-size="17" fill="#526276">Logical blocks for prefix caching · Physical tokens for data exchange</text>
  </g>
</svg>
