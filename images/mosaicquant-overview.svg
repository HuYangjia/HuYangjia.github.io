<svg xmlns="http://www.w3.org/2000/svg" width="960" height="224" viewBox="0 0 960 224" role="img" aria-labelledby="title desc">
  <title id="title">MosaicQuant unified 4-bit weight representation</title>
  <desc id="desc">A dense 4-bit base plus block-sparse 4-bit residuals form the approximate weight matrix. Accuracy is evaluated in INT4 and FP4; system performance uses INT4 GPU execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.8"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="222" rx="16" fill="#f8fafc" stroke="#dbe3ed"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="24" y="40" width="246" height="108" rx="10" fill="#e8efff" stroke="#88a7e1"/>
    <text x="147" y="83" font-size="23" font-weight="700" fill="#254780">Dense 4-bit base</text>
    <text x="147" y="115" font-size="17" fill="#405b84">Main weight representation</text>
    <text x="302" y="104" font-size="34" fill="#64748b">+</text>
    <rect x="336" y="40" width="278" height="108" rx="10" fill="#e5f4ee" stroke="#83b6a1"/>
    <text x="475" y="83" font-size="22" font-weight="700" fill="#21664f">Sparse 4-bit residuals</text>
    <text x="475" y="115" font-size="17" fill="#3f725f">Selected compensation blocks</text>
    <path d="M631 94H674" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="693" y="40" width="243" height="108" rx="10" fill="#fff" stroke="#b5c0cf"/>
    <text x="814" y="83" font-size="22" font-weight="700" fill="#27384e">Approximate weights</text>
    <text x="814" y="115" font-size="17" fill="#526276">Unified 4-bit branches</text>
    <text x="480" y="188" font-size="18" fill="#526276">Activation-aware block selection · Fused GPU execution with ZipperEngine</text>
  </g>
</svg>
